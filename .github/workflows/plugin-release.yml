name: Build Photoshop plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches both version files
        run: node scripts/verify-version.mjs "${{ github.ref_name }}"

      - name: Build and package the add-on
        run: npm run release:assets

      - name: Upload the release assets
        uses: actions/upload-artifact@v4
        with:
          name: lumiform-colorpicker-release
          path: |
            release/Lumiform-Colorpicker.ccx
            release/Lumiform-Colorpicker.zip
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach the assets to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Lumiform-Colorpicker.ccx
            release/Lumiform-Colorpicker.zip
            release/SHA256SUMS.txt
          generate_release_notes: true
