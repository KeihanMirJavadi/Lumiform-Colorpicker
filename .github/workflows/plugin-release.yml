name: Build Photoshop plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package the add-on
        run: npm run plugin

      - name: Upload the .ccx artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumiform-colorpicker-ccx
          path: release/*.ccx
          if-no-files-found: error

      - name: Attach the .ccx to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.ccx
